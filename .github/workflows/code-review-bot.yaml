name: Crush Code Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  code-review:
    name: Crush Code Review
    runs-on: agh-marines-server
    container: ubuntu:24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and dependencies
        run: |
          apt update
          apt install -y python3 python3-pip && rm -rf /var/lib/apt/lists/*
          pip3 install requests --break-system-packages

      - name: Install Crush
        run: |
          echo "Installing Crush CLI..."
          apt install -y curl
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | tee /etc/apt/sources.list.d/charm.list
          apt update && apt install -y crush

      - name: Configure Crush with GLM-4.7
        run: |
          echo "Configuring Crush for GLM-4.7..."
          
          # Create custom crush.json for this workflow
          mkdir -p $HOME/.config/crush
          cat > $HOME/.config/crush/crush.json << 'EOF'
          {
            "$schema": "https://charm.land/crush.json",
            "options": {
              "skills_paths": ["${{ github.workspace }}/.config/crush/skills/skills"]
            },
            "providers": {
              "zai": {
                "name": "Z.AI",
                "base_url": "https://open.bigmodel.cn/api/paas/v4/",
                "type": "openai-compat",
                "api_key_env": ${{ secrets.ZAI_API_KEY }},
                "models": [
                  {
                    "name": "GLM-4.7",
                    "id": "glm-4",
                    "context_window": 128000,
                    "default_max_tokens": 4096
                  }
                ]
              }
            }
          }
          EOF

          echo "Crush configuration created at $HOME/.config/crush/crush.json"

      - name: Run Code Review Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          PROJECT_PATH: ${{ github.workspace }}
          CRUSH_CONFIG_PATH: $HOME/.config/crush/crush.json
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          . /tmp/venv/bin/activate
          python .github/scripts/code_review_bot.py
        continue-on-error: true

  code-review-comment:
    name: Post Review Summary
    runs-on: agh-marines-server
    container: ubuntu:24.04
    needs: code-review
    if: always()
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reviewCompleted = '${{ needs.code-review.result }}';

            let commentBody = '## 🤖 Crush Code Review Bot Status\n\n';
            commentBody += `**Status**: ${reviewCompleted}\n\n`;

            if (reviewCompleted === 'success') {
              commentBody += '✅ Code review completed successfully!\n\n';
              commentBody += 'Check the comments above for detailed suggestions from Crush.\n\n';
            } else if (reviewCompleted === 'failure') {
              commentBody += '❌ Code review encountered an error.\n\n';
              commentBody += 'Please check the workflow logs for details.\n\n';
            } else {
              commentBody += '⚠️ Code review was skipped or cancelled.\n\n';
            }

            commentBody += '---\n\n';
            commentBody += 'This bot uses Crush AI to analyze your code changes and provide suggestions.\n';

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Crush Code Review Bot Status')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
