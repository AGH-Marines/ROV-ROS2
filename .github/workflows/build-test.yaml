name: Build and Test ROS2 Workspace

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build and Validate ROS2 Workspace
    runs-on: agh-marines-server
    container: ubuntu:24.04
    env:
      ROS_DISTRO: humble
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        run: |
          docker build -f .devcontainer/Dockerfile.devcontainer -t ros2-devcontainer .

      - name: Build ROS2 workspace
        id: build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/dev/ros2_ws \
            ros2-devcontainer \
            bash -c "
              source /opt/ros/humble/setup.bash && \
              colcon build --symlink-install --event-handlers console_direct+ 2>&1 | tee /tmp/build_output.log
            "
          docker run --rm \
            -v ${{ github.workspace }}:/home/dev/ros2_ws \
            ros2-devcontainer \
            bash -c "cat /tmp/build_output.log" > ${{ github.workspace }}/build_output.log

      - name: Validate build succeeded
        run: |
          if grep -i -E "Failed|FAILED" ${{ github.workspace }}/build_output.log; then
            echo "❌ Build failed - found 'failed' in build output"
            cat ${{ github.workspace }}/build_output.log
            exit 1
          else
            echo "✅ Build completed successfully - no failures detected"
          fi

      - name: Run package tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/dev/ros2_ws \
            ros2-devcontainer \
            bash -c "
              source /opt/ros/humble/setup.bash && \
              source /home/dev/ros2_ws/install/setup.bash && \
              colcon test --event-handlers console_direct+ 2>&1 | tee /tmp/test_output.log
            "
          docker run --rm \
            -v ${{ github.workspace }}:/home/dev/ros2_ws \
            ros2-devcontainer \
            bash -c "cat /tmp/test_output.log" > ${{ github.workspace }}/test_output.log

      - name: Display test results
        if: always()
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/dev/ros2_ws \
            ros2-devcontainer \
            bash -c "
              source /opt/ros/humble/setup.bash && \
              source /home/dev/ros2_ws/install/setup.bash && \
              colcon test-result --verbose
            "

      - name: Summary
        if: always()
        run: |
          echo "=== Build Summary ==="
          echo "Build output:" && cat ${{ github.workspace }}/build_output.log || echo "No build output found"
          echo ""
          echo "Test output:" && cat ${{ github.workspace }}/test_output.log || echo "No test output found"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ github.workspace }}/log/latest_test/
            ${{ github.workspace }}/build/
            ${{ github.workspace }}/test_output.log
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/log/latest_build/
            ${{ github.workspace }}/build_output.log
          retention-days: 7

