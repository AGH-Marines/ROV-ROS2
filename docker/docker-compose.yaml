services:
  rov-ros2-server:
#    build:
#      context: ..
#     rov-ros2-server  dockerfile: docker/Dockerfile.server
#    platform: linux/arm64
    image: rov-ros2-server:latest
    network_mode: host
    stdin_open: true
    tty: true
    privileged: true
    environment:
      DISPLAY: ${DISPLAY}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility,compute
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/home/dev/ros2_ws
    entrypoint:  bash